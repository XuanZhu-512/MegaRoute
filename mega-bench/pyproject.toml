[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-bench-tools"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5", "matplotlib==3.9.2"]

[project.optional-dependencies]
validation = ["jsonschema==4.23.0"]
build = ["ninja==1.11.1.3"]

[project.scripts]
pcb-bench = "pcb_bench.cli:main"

[tool.setuptools.packages.find]
where = ["python"]
